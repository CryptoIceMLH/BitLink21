# BitLink21 — single container (Ground Station fork + HSModem modem, QO-100 beacon lock, Bitcoin/Lightning)
#   docker compose up -d     pulls the ready-made image from GHCR
#   docker compose build     builds it from source instead (about an hour)

services:
  bitlink21:
    image: ghcr.io/cryptoicemlh/bitlink21:4.0.4
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        BUILD_VERSION: ${BUILD_VERSION:-4.0.4}
    container_name: bitlink21
    environment:
      # PlutoSDR configuration
      PLUTO_URI: "${PLUTO_URI:-ip:192.168.1.200}"
      # BitLink21 specific
      BITLINK21_DB_PATH: "/app/backend/data/bitlink21.db"
      # Bitcoin Core RPC (optional)
      BITCOIN_RPC_URL: "${BITCOIN_RPC_URL:-}"
      BITCOIN_RPC_USER: "${BITCOIN_RPC_USER:-}"
      BITCOIN_RPC_PASS: "${BITCOIN_RPC_PASS:-}"
      # LND REST (optional)
      LND_REST_URL: "${LND_REST_URL:-}"
    ports:
      - "${BITLINK21_PORT:-7000}:7000"
    volumes:
      - ./data:/app/backend/data
    # Uncomment to reach a Pluto over USB (PLUTO_URI=usb:...) instead of the network:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    privileged: false
    restart: unless-stopped
