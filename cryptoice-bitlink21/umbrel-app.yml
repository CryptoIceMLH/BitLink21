releaseNotes: >-
  v4.0.8: Lightning with your own LND node: paste the lndconnect link from
  your Umbrel's Lightning app, then pay invoices that arrive over the
  satellite (Pay button with confirmation and a fee cap, never paid twice),
  send a payment receipt back, and request payments (your node makes the
  invoice, BitLink21 sends it and shows it as paid). New Dish alignment page:
  the beacon's C/N0 measured like a satellite meter (steady, does not jump
  with the beacon's modulation), MER, beacon level and noise floor, best
  value hold, 60 s graph, live beacon spectrum and a tone for aligning
  without looking. The station must be running.

  v4.0.7: New HyperLink speed (next to Fast/Turbo): BitLink21's own fast
  mode (OFDM, 16-QAM, LDPC), about twice as fast as Turbo in practice (1 kB
  in 1.6 s), BitLink21 stations only, needs a ~13 dB signal; large files go
  as one transmission. Beacon lock fixed: searches +-40 kHz (LNB errors past
  25 kHz were missed) and never sticks on a side line 400 Hz off the beacon.
  Receiver fix: QPSK 3000/4000 and 8APSK 5500/6000 lost data (samples were
  dropped); all speeds now follow your echo's drift while you transmit.
  Tested on air in every speed. NOTE: transmit now drives the Pluto near full
  scale, so the same TX gain is about 6 dB STRONGER than before: lower your TX
  gain (e.g. by 6 dB) after updating. Recommended RX gain: 25 dB.

  v4.0.6: Beacon lock and modem now follow a fast-drifting receive
  frequency (20-40 Hz/s, as when the station transmits): no more beacon
  unlock after every message, and long BPSK messages decode through the
  drift. The modem uses the beacon-measured drift to stay on frequency.
  Wideband (DVB-S2) tab removed (a faster narrowband mode is planned
  instead); smaller image. Fixed garbled characters in the activity panel.

  v4.0.5: Wideband (DVB-S2) receiver fixed: it was built for the build
  machine's CPU and crashed straight away on the Umbrel ("Broken pipe"); it
  now runs on any x86-64, and if it ever stops the reason is shown. Stop
  button to end a transmission (queued, waiting or on air). Beacon lock stays
  locked when you change channel or speed, and picks up from the last lock
  after a restart. TX frequency is never moved automatically any more (the
  echo-based auto correction is gone and its value reset to 0). Your echoed
  file is kept in the Files tab ("Echo of your file"); sent and received
  files can be opened and downloaded. Diagnostics: verbose logging switch and
  a downloadable diagnostics zip (logs, version, system info, radio status).

  v4.0.4: New Experimental tab: send the same messages and files over
  DVB-S2 on the QO-100 wideband transponder (125-333 kS/s, up to ~600
  kbit/s, e.g. 100 kB in a few seconds). No frequency limits: transmit on
  whatever frequency you enter, narrowband or wideband. Live receiver activity on the Link page (decoding state, recent
  frames, incoming file progress) and transmit progress. Listen before talk:
  sending waits while another signal is on your channel. Files up to 500 kB
  (larger ones go out as parts that BitLink21 stations rejoin); transmit is
  generated while sending, so long files no longer need gigabytes of memory.
  Your echo no longer shows as missed when it is heard before the send
  finishes. The Pluto's transmit frequency is set once at start instead of on
  every send. Bigger receive and transmit buffers. Faster, lighter UI; no
  satellite database download at start. Received files can be deleted;
  classic radio no longer errors on a removed SDR; File Browser removed.

  v4.0.3: Receiver no longer falls behind while transmitting (modem and
  beacon tracker about 3x lighter, bigger receive buffer). PlutoSDR
  reconnects automatically after a dropped connection, or says to
  power-cycle it. The radio can no longer be started twice. Send plain
  files (up to 200 kB, readable by any HSModem station). New message view
  with All / Received / Sent / Files tabs; your own messages show clearly
  when they were heard back via the satellite.

  v4.0.2: Fix QO-100 beacon lock for LNB errors beyond 16.7 kHz (it could
  lock on a false frequency, so nothing was received). Calibration only from
  a steady lock. Lighter UI: tracking, scheduler, rigs, rotators and
  satellite database pages removed; PlutoSDR / Pluto+ only (no other SDR
  drivers, no USRP image downloads). Faster, cleaner radio stop; startup fix;
  correct version shown; uplink SSB dial shown.

  v4.0.1: Fix PlutoSDR not detected (Python libiio bindings matched to the
  system libiio).

  v4.0.0: Radio rebuilt from the ground up. New Link page: type a frequency and press
  send. HSModem-compatible modem verified on live QO-100 signals, automatic QO-100
  beacon lock with drift tracking, delivery confirmation via the satellite and
  automatic uplink correction, first-run setup wizard, Bitcoin and Lightning page.
  Nostr support has been removed. Transmit is off until enabled in the app.
