manifestVersion: 1.1
id: cryptoice-bitlink21
name: BitLink21
tagline: Bitcoin decentralized satellite communication system
icon: bitlink21-128.png
category: bitcoin
version: "4.0.3"
port: 7000
description: >-
  BitLink21 sends messages, Bitcoin transactions and Lightning invoices over the
  QO-100 geostationary satellite with a PlutoSDR. No internet needed between stations.

  Type a channel frequency and press send: BitLink21 starts the radio, locks to the
  QO-100 beacon to cancel LNB drift, tunes the channel automatically and confirms
  delivery by hearing your own message back through the satellite. On air it is fully
  compatible with DJ0ABR's HSModem (BPSK/QPSK/8APSK, RS(255,223) FEC), so it also
  receives the AMSAT-DL multimedia beacon. Received Bitcoin transactions can be
  broadcast through your own node. The full Ground Station toolkit (waterfall, VFOs,
  decoders, satellite tracking) remains available as the classic radio view.
